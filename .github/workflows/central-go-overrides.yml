name: Central Go Overrides

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Optional configured image-build repository (blank for all)
        required: false
        type: string
      apply:
        description: Push branches and open PRs (otherwise report only)
        required: true
        default: false
        type: boolean

concurrency:
  group: central-go-overrides
  cancel-in-progress: false

permissions: {}

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out central policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select configured repositories
        id: repositories
        env:
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          names=$(jq -er --arg repo "$TARGET_REPO" '
            [.repositories[].name | select($repo == "" or . == $repo)] |
            if length == 0 then error("no configured repositories match --repo") else join("\n") end
          ' overrides_central.json)
          {
            echo 'names<<EOF'
            echo "$names"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Read App Secrets
        env:
          GH_TOKEN: ${{ github.token }}
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/auto-approve/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/auto-approve/app-credentials privateKey | PRIVATE_KEY

      - name: Create App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repositories.outputs.names }}
          permission-contents: ${{ inputs.apply && 'write' || 'read' }}
          permission-pull-requests: ${{ inputs.apply && 'write' || 'read' }}

      - name: Plan and optionally propose local overrides
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          TARGET_REPO: ${{ inputs.repo }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          args=(--owner "$OWNER")
          if [[ -n "$TARGET_REPO" ]]; then args+=(--repo "$TARGET_REPO"); fi
          if [[ "$APPLY" != true ]]; then args+=(--dry-run); fi
          scripts/generate_pr.sh "${args[@]}"
