name: Renovate Auto-Approve

on:
  schedule:
    # 06:00 EST, Monday through Friday
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      repository:
        description: Optional process a single image-build repository
        required: false
        type: string

concurrency:
  group: auto-approve
  cancel-in-progress: true

permissions: {}

jobs:
  approve:
    name: Approve Renovate PRs
    permissions:
      contents: read # Check out the repository configuration.
      id-token: write # Allow Vault action to authenticate with GitHub OIDC.
      pull-requests: read # Read PR restrictions and review state.
    runs-on: ubuntu-latest
    steps:
      - name: Check out configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read configured repositories
        id: configured-repos
        env:
          TARGET_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || '' }}
        run: |
          set -euo pipefail

          {
            echo 'repositories<<EOF'
            jq -r --arg target "$TARGET_REPOSITORY" '
              if $target == "" then .repositories
              elif ($target | test("^image-build-[a-z0-9][a-z0-9.-]*$")) and any(.repositories[]; .name == $target) then
                [.repositories[] | select(.name == $target)]
              else error("repository must be a configured image-build-* repository")
              end | .[].name
            ' config.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Read App Secrets
        env:
          GH_TOKEN: ${{ github.token }}
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/auto-approve/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/auto-approve/app-credentials privateKey | PRIVATE_KEY

      - name: Create App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.configured-repos.outputs.repositories }}
          permission-contents: read
          permission-pull-requests: write

      - name: Read PR configuration
        id: pr-config
        env:
          OWNER: ${{ github.repository_owner }}
          TARGET_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || '' }}
        run: |
          set -euo pipefail

          {
            echo 'repositories<<EOF'
            jq -c --arg owner "$OWNER" --arg target "$TARGET_REPOSITORY" '
              if $target == "" then .repositories
              elif ($target | test("^image-build-[a-z0-9][a-z0-9.-]*$")) and any(.repositories[]; .name == $target) then
                [.repositories[] | select(.name == $target)]
              else error("repository must be a configured image-build-* repository")
              end | .[] | {repo: "\($owner)/\(.name)", regexes: (.regexes // [])}
            ' config.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Find eligible PRs
        id: eligibility
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_CONFIGS: ${{ steps.pr-config.outputs.repositories }}
        run: |
          set -euo pipefail

          eligible_prs=()
          while IFS= read -r repo_config; do
            repo=$(jq -r '.repo' <<<"$repo_config")
            [[ -z "$repo" ]] && continue
            mapfile -t regexes < <(jq -r '.regexes[]' <<<"$repo_config")

            if ! pr_list_json=$(gh pr list --repo "$repo" --state open \
              --author 'app/renovate-rancher' \
              --limit 100 \
              --json number,autoMergeRequest,headRepository,headRefName \
              --jq '.[] | @json'); then
              echo "Failed to get open Renovate PRs from $repo."
              continue
            fi

            while IFS= read -r pr_json; do
            pr_number=$(jq -r '.number' <<<"$pr_json")
            head_ref=$(jq -r '.headRefName' <<<"$pr_json")

            if [[ $(jq -r '.autoMergeRequest' <<<"$pr_json") == "null" ||
              $(jq -r '.headRepository.nameWithOwner' <<<"$pr_json") != "$repo" ||
              "$head_ref" != updatecli_* ]]; then
              continue
            fi

            if ! changed_lines=$(gh pr diff "$pr_number" --repo "$repo" --patch | sed -n '/^[+-][^+-]/ { s/^[+-]//; p; }'); then
              echo "Could not read diff for $repo#$pr_number."
              continue
            fi
            if gh pr diff "$pr_number" --repo "$repo" --name-only | grep -Fxq 'TAG' ||
              grep -Eq '^[[:space:]]*ARG[[:space:]]+GO_IMAGE=' <<<"$changed_lines"; then
              eligible_prs+=("$repo:$pr_number")
              continue
            fi
            for regex in "${regexes[@]}"; do
              if grep -Eq -- "$regex" <<<"$changed_lines"; then
                eligible_prs+=("$repo:$pr_number")
                break
              fi
            done
            done <<<"$pr_list_json"
          done <<<"$REPO_CONFIGS"

          printf 'eligible_prs=%s\n' "${eligible_prs[*]}" >> "$GITHUB_OUTPUT"

      - name: Approve PR
        if: steps.eligibility.outputs.eligible_prs != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBERS: ${{ steps.eligibility.outputs.eligible_prs }}
        run: |
          set -euo pipefail

          for repo_and_number in $PR_NUMBERS; do
            repo=${repo_and_number%:*}
            pr_number=${repo_and_number##*:}
            review_decision=$(gh pr view "$pr_number" --repo "$repo" \
              --json reviewDecision --jq '.reviewDecision')

            if [[ "$review_decision" == "APPROVED" ]]; then
              echo "PR $repo#$pr_number is currently approved."
              continue
            fi

            gh pr review "$pr_number" \
              --repo "$repo" \
              --approve \
              --body "Auto-approving Renovate/UpdateCLI PR with auto-merge enabled."
          done